function wrap(text,x,y,maxW,lh,align='left'){const words=text.split(' ');let line='',lines=[];for(const w of words){const tst=line?line+' '+w:w;if(g.measureText(tst).width>maxW&&line){lines.push(line);line=w}else line=tst}lines.push(line);g.textAlign=align;lines.forEach((l,i)=>g.fillText(l,x,y+i*lh));return lines.length;}

function face(x,y,w,h,zoom){const im=LOOPIMG;if(!im)return;const s=Math.max(w/im.width,h/im.height)*zoom;const dw=im.width*s,dh=im.height*s;
  const fx=.5,fy=.40;let dx=x+w/2-dw*fx,dy=y+h*.45-dh*fy;dx=Math.min(x,Math.max(x+w-dw,dx));dy=Math.min(y,Math.max(y+h-dh,dy));

// ---- Sound-Cues: render.cjs mischt diese Effekte aus assets/sfx unter die Stimme ----
function buildCues(){const q=[];const add=(t,n,v)=>{if(t<900)q.push({t:Math.max(0,t),name:n,vol:v||1});};
  add(0,'impact',.9);
  for(let k=1;k<PH.length;k++)add(WORDS[PH[k].a].start-.2,'whoosh',.55);
  add(WORDS[PH[PH.length-1].a].start+.1,'outro',.6);
  (window.EXTRA_CUES?window.EXTRA_CUES():[]).forEach(c=>add(c.t,c.name,c.vol));
  q.sort((a,b)=>a.t-b.t);const out=[];for(const c of q){if(!out.some(o=>o.name===c.name&&Math.abs(o.t-c.t)<.15))out.push(c);}return out;}
// ================= Stil reel4: Bubble-Sprecher =================
// Inhalt im Vollbild (Überschrift oben wie reel2, Grafik in der Mitte, hell/dunkel nach PH.light),
// Jonas als runde Facecam-Bubble unten rechts (lippensynchrones face.mp4).
// Bubble wie im Referenz-Screenshot: groß, Kopf mittig mit Luft darüber, Schultern sichtbar, Mikro unten angeschnitten.
// Das HeyGen-Video hat kaum Platz über dem Kopf -> Video nach unten versetzt, oben mit weichgezeichnetem Hintergrund aufgefüllt.
const BOFF=document.createElement('canvas');const SMP=document.createElement('canvas');SMP.width=4;SMP.height=4;
function bubble(t){const r=180,cx=1080-r-60,cy=1550;const a=back(t,0,.45);if(a<=0)return;const im=LOOPIMG;g.save();g.translate(cx,cy);g.scale(a,a);g.translate(-cx,-cy);
  g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=50;g.shadowOffsetY=16;g.beginPath();g.arc(cx,cy,r+8,0,7);g.fillStyle=L('#2a2338','#ffffff');g.fill();g.shadowColor='transparent';
  g.beginPath();g.arc(cx,cy,r,0,7);g.clip();
  if(im){const D=2*r;// Hintergrund: Bild stark vergrößert + weichgezeichnet
    // Hintergrund oben: Wandfarbe aus dem Video (Ecke rechts oben gemessen), kein Bildausschnitt -> keine Geisterbilder
    const sm=SMP.getContext('2d',{willReadFrequently:true});sm.drawImage(im,im.width*.72,0,im.width*.2,im.height*.12,0,0,4,4);const px=sm.getImageData(0,0,4,4).data;let R=0,G=0,B=0;for(let i=0;i<64;i+=4){R+=px[i];G+=px[i+1];B+=px[i+2];}
    const col=`rgb(${R/16|0},${G/16|0},${B/16|0})`;g.fillStyle=col;g.fillRect(cx-r,cy-r,D,D);
    // Vordergrund: volle Videohöhe = Bubble-Durchmesser, um 20 % nach unten versetzt, oberer Rand weich ausgeblendet
    // Kopfgröße wie Referenz (Zoom 1,0), Augen bei ~28 % der Kreishöhe (vom Nutzer gewählt, Option C); nur ein schmaler Streifen oben wird mit Wandfarbe gefüllt
    BOFF.width=D;BOFF.height=D;const o=BOFF.getContext('2d');o.clearRect(0,0,D,D);const Z=1.0,s=D/im.height*Z,dw=im.width*s,dh=im.height*s,dy=0;
    o.drawImage(im,D/2-dw*.5,dy,dw,dh);o.globalCompositeOperation='destination-in';const gr=o.createLinearGradient(0,dy,0,dy+14);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,1)');o.fillStyle=gr;o.fillRect(0,0,D,D);o.globalCompositeOperation='source-over';
    g.drawImage(BOFF,cx-r,cy-r);}
  g.restore();}
