const W=1080,H=1920,c=document.getElementById('c'),g=c.getContext('2d');
const C={bg:'#17141f',bg2:'#221d30',wall:'#1d1928',violet:'#8b6cf0',violetL:'#b9a6ff',warm:'#f6efe4',ink:'#141019',red:'#ef5a4c',green:'#3ccf8e',amber:'#ffc65c',skin:'#f2c7a5',hair:'#3a2a22',desk:'#6b4a35',deskTop:'#8a6146',grey:'#c9c4d4'};
let WORDS=[],K=i=>0,KE=i=>0,END=27;
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
const pop=(t,t0,d=.35)=>{const x=(t-t0)/d;if(x<=0)return 0;if(x>=1)return 1;return 1+2.2*Math.pow(x-1,3)+1.2*Math.pow(x-1,2)*0;};
const back=(t,t0,d=.4)=>{let x=Math.min(Math.max((t-t0)/d,0),1);const s=1.9;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2);};
function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function speaking(t){return WORDS.some(w=>t>=w.start&&t<=w.end);}
function font(w,s,f='Manrope'){g.font=`${w} ${s}px ${f}`;}

let LIGHT=false;const L=(dark,light)=>LIGHT?light:dark;const TXT=()=>LIGHT?C.ink:'#fff';
function bgStudio(t){

}
function desk(){g.fillStyle=C.deskTop;rr(110,1150,860,34,10);g.fill();g.fillStyle=C.desk;g.fillRect(150,1184,26,240);g.fillRect(904,1184,26,240);}

  g.fillStyle='#4b4466';rr(-185,-12,370,20,8);g.fill();

// Jonas als Memoji-artige Karikatur: weich schattiert, großer Kopf, Brille, Bartstoppeln, schwarzes T-Shirt
function prand(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function rg(x0,y0,r0,x1,y1,r1,stops){const gr=g.createRadialGradient(x0,y0,r0,x1,y1,r1);stops.forEach(([o,c])=>gr.addColorStop(o,c));return gr;}
function lg(x0,y0,x1,y1,stops){const gr=g.createLinearGradient(x0,y0,x1,y1);stops.forEach(([o,c])=>gr.addColorStop(o,c));return gr;}
function hand(x,y,ang,pose){g.save();g.translate(x,y);g.rotate(ang);
  const sk=rg(-10,-10,4,0,0,46,[[0,'#f7d2b4'],[1,'#dea27f']]);g.fillStyle=sk;
  rr(-34,-30,68,62,26);g.fill();
  if(pose==='point'){rr(-12,-96,24,76,12);g.fill();g.fillStyle='rgba(150,90,60,.35)';rr(-12,-40,24,6,3);g.fill();}
  else if(pose==='open'){for(let i=0;i<4;i++){g.fillStyle=sk;rr(-32+i*17,-78+Math.abs(i-1.5)*6,15,56,8);g.fill();}}
  g.fillStyle=sk;g.save();g.rotate(-.7);rr(-48,-6,40,20,10);g.fill();g.restore();
  g.restore();}
function guy(x,y,s,t,o={}){g.save();g.translate(x,y);g.scale(s,s);
  const bob=Math.sin(t*2.6)*3,tilt=Math.sin(t*1.7)*.025;g.translate(0,bob);
  // ---- body: black tee with soft light
  g.save();g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=40;
  g.beginPath();g.moveTo(-210,260);g.bezierCurveTo(-205,60,-150,-10,-70,-30);g.lineTo(70,-30);g.bezierCurveTo(150,-10,205,60,210,260);g.closePath();
  g.fillStyle=lg(0,-40,0,260,[[0,'#2e2c35'],[1,'#141318']]);g.fill();g.restore();
  g.fillStyle=rg(-60,20,10,-40,40,200,[[0,'rgba(255,255,255,.10)'],[1,'rgba(255,255,255,0)']]);g.beginPath();g.moveTo(-210,260);g.bezierCurveTo(-205,60,-150,-10,-70,-30);g.lineTo(70,-30);g.bezierCurveTo(150,-10,205,60,210,260);g.closePath();g.fill();
  // neck + collar
  g.fillStyle=lg(0,-90,0,-20,[[0,'#e2a988'],[1,'#c98c6c']]);rr(-46,-100,92,90,30);g.fill();
  g.strokeStyle='#3a3842';g.lineWidth=10;g.beginPath();g.moveTo(-58,-32);g.quadraticCurveTo(0,14,58,-32);g.stroke();
  // ---- arm / hand gestures
  if(o.point||o.wave){const sw=o.wave?Math.sin(t*9)*.3:Math.sin(t*4)*.05;
    const L=o.point?-1:1;g.save();g.translate(150*L,20);g.rotate((o.point?-.6:.55)+sw);
    g.fillStyle=lg(0,0,0,-170,[[0,'#1d1c22'],[.4,'#2a2830'],[.41,'#e3ab8b'],[1,'#e8b393']]);rr(-32,-170,64,190,32);g.fill();
    hand(0,-200,0,o.wave?'open':'point');g.restore();}

  g.save();g.translate(0,-215);g.rotate(tilt);
  // ears
  [-1,1].forEach(sd=>{g.fillStyle=rg(sd*118,-5,4,sd*118,0,40,[[0,'#f0c0a0'],[1,'#d79878']]);g.beginPath();g.ellipse(sd*116,0,24,38,sd*.15,0,7);g.fill();g.fillStyle='rgba(170,100,75,.45)';g.beginPath();g.ellipse(sd*118,2,10,20,sd*.15,0,7);g.fill();});
  // face shape: longish oval, defined jaw
  const face=()=>{g.beginPath();g.moveTo(-112,-40);g.bezierCurveTo(-118,70,-80,140,0,150);g.bezierCurveTo(80,140,118,70,112,-40);g.bezierCurveTo(108,-170,-108,-170,-112,-40);g.closePath();};
  face();g.fillStyle=rg(-30,-60,20,0,0,190,[[0,'#f8d5b8'],[.65,'#efbd9c'],[1,'#d99a78']]);g.fill();
  // cheek warmth + side shading
  g.fillStyle='rgba(230,130,110,.18)';g.beginPath();g.ellipse(-62,40,30,20,0,0,7);g.ellipse(62,40,30,20,0,0,7);g.fill();
  // stubble: jaw, chin, moustache
  g.save();face();g.clip();
  g.fillStyle='rgba(95,72,58,.17)';g.beginPath();g.moveTo(-112,10);g.bezierCurveTo(-100,100,-60,150,0,152);g.bezierCurveTo(60,150,100,100,112,10);g.bezierCurveTo(80,62,50,58,0,60);g.bezierCurveTo(-50,58,-80,62,-112,10);g.fill();
    for(let i=0;i<420;i++){const a=prand(i)*Math.PI,r=60+prand(i+999)*95;const px=Math.cos(a)*r*(prand(i+5)>.5?1:-1)*.95,py=40+Math.sin(a)*r*.75;if(py<45&&Math.abs(px)<60)continue;g.fillStyle=`rgba(70,52,42,${.25+prand(i+7)*.3})`;g.fillRect(px,py,2.2,2.2);}
  g.restore();
  // hair: short faded sides + textured top with receding temples
  g.fillStyle=lg(0,-170,0,-40,[[0,'rgba(60,44,34,.0)'],[1,'rgba(60,44,34,.55)']]);
  [-1,1].forEach(sd=>{g.beginPath();g.moveTo(sd*112,-30);g.quadraticCurveTo(sd*120,-90,sd*96,-128);g.lineTo(sd*84,-60);g.closePath();g.fill();});
  g.beginPath();g.moveTo(-104,-92);
  g.bezierCurveTo(-118,-150,-92,-196,-40,-206);
  g.bezierCurveTo(-30,-226,-2,-232,14,-222);
  g.bezierCurveTo(34,-240,70,-236,82,-214);
  g.bezierCurveTo(108,-212,124,-186,114,-158);
  g.bezierCurveTo(122,-136,112,-110,102,-92);
  g.bezierCurveTo(96,-112,80,-132,58,-128);
  g.bezierCurveTo(40,-120,-40,-120,-58,-128);
  g.bezierCurveTo(-80,-132,-96,-112,-104,-92);g.closePath();
  g.fillStyle=lg(-20,-236,20,-110,[[0,'#614736'],[.55,'#453226'],[1,'#3a2a20']]);g.fill();
  g.strokeStyle='rgba(130,100,76,.5)';g.lineWidth=5;g.lineCap='round';
  [[-70,-140,-36,-194],[-40,-146,-8,-206],[-8,-148,24,-212],[22,-146,58,-210],[52,-140,92,-190]].forEach(([a,b,c2,d])=>{g.beginPath();g.moveTo(a,b);g.quadraticCurveTo((a+c2)/2+14,(b+d)/2+4,c2,d);g.stroke();});
  g.strokeStyle='rgba(30,20,15,.35)';g.lineWidth=4;
  [[-56,-150,-20,-186],[10,-152,40,-196],[40,-150,72,-186]].forEach(([a,b,c2,d])=>{g.beginPath();g.moveTo(a,b);g.quadraticCurveTo((a+c2)/2+10,(b+d)/2,c2,d);g.stroke();});
  // brows
  g.strokeStyle='#4b3627';g.lineWidth=10;g.lineCap='round';const bt=o.frown?6:0;
  g.beginPath();g.moveTo(-74,-58+bt);g.quadraticCurveTo(-48,-66,-20,-60-bt);g.moveTo(20,-60-bt);g.quadraticCurveTo(48,-66,74,-58+bt);g.stroke();
  // eyes
  const blink=(t%3.9)<.11;
  [-1,1].forEach(sd=>{const ex=sd*46,ey=-26;if(blink){g.strokeStyle='#3b2a22';g.lineWidth=4;g.beginPath();g.moveTo(ex-16,ey);g.quadraticCurveTo(ex,ey+5,ex+16,ey);g.stroke();return;}
    g.fillStyle='#fbf8f6';g.beginPath();g.ellipse(ex,ey,19,13,0,0,7);g.fill();
    g.fillStyle=rg(ex,ey,1,ex,ey,11,[[0,'#2a3a48'],[.45,'#5b7f9c'],[1,'#3d5468']]);g.beginPath();g.arc(ex+sd*1,ey+1,10,0,7);g.fill();
    g.fillStyle='#14181d';g.beginPath();g.arc(ex+sd*1,ey+1,4.5,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(ex+4,ey-3,3,0,7);g.fill();
    g.strokeStyle='rgba(120,70,50,.6)';g.lineWidth=3;g.beginPath();g.ellipse(ex,ey,19,13,0,Math.PI*1.05,Math.PI*1.95);g.stroke();});
  // nose
  g.fillStyle='rgba(200,120,90,.28)';g.beginPath();g.moveTo(-4,-30);g.quadraticCurveTo(-14,18,-16,30);g.quadraticCurveTo(0,40,16,30);g.quadraticCurveTo(10,10,6,-30);g.fill();
  g.fillStyle='rgba(255,235,220,.5)';g.beginPath();g.ellipse(2,18,6,14,0,0,7);g.fill();
  // mouth
  const talk=o.talk&&speaking(t)?(2+Math.abs(Math.sin(t*22))*8):0;
  if(talk){g.fillStyle='#6b2c33';g.beginPath();g.ellipse(0,86,26,talk,0,0,7);g.fill();g.fillStyle='#fff';g.fillRect(-14,86-talk,28,Math.min(4,talk));}
  else{g.strokeStyle='#9a4f4f';g.lineWidth=6;g.lineCap='round';g.beginPath();if(o.frown){g.moveTo(-22,92);g.quadraticCurveTo(0,82,22,92);}else{g.moveTo(-26,82);g.quadraticCurveTo(0,96,26,82);}g.stroke();}
  // glasses: thin silver, large rectangles, double bridge
  g.strokeStyle='#c4c8d0';g.lineWidth=4;
  [-1,1].forEach(sd=>{rr(sd>0?10:-92,-60,82,64,14);g.stroke();g.fillStyle='rgba(225,238,255,.10)';rr(sd>0?12:-90,-58,78,60,12);g.fill();});
  g.beginPath();g.moveTo(-10,-34);g.quadraticCurveTo(0,-40,10,-34);g.moveTo(-70,-60);g.lineTo(70,-60);g.moveTo(-92,-50);g.lineTo(-116,-44);g.moveTo(92,-50);g.lineTo(116,-44);g.stroke();
  g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=3;g.beginPath();g.moveTo(-84,-50);g.lineTo(-70,-58);g.moveTo(18,-50);g.lineTo(32,-58);g.stroke();
  g.restore();
  g.restore();}

function card(x,y,w,h,fill,stroke){rr(x,y,w,h,28);g.fillStyle=fill;g.fill();if(stroke){g.lineWidth=4;g.strokeStyle=stroke;g.stroke();}}
function wrap(text,x,y,maxW,lh,align='left'){const words=text.split(' ');let line='',lines=[];for(const w of words){const tst=line?line+' '+w:w;if(g.measureText(tst).width>maxW&&line){lines.push(line);line=w}else line=tst}lines.push(line);g.textAlign=align;lines.forEach((l,i)=>g.fillText(l,x,y+i*lh));return lines.length;}
function withAlpha(a,fn){g.save();g.globalAlpha=Math.max(0,Math.min(1,a));fn();g.restore();}
function scaleAt(cx,cy,s,fn){g.save();g.translate(cx,cy);g.scale(s,s);g.translate(-cx,-cy);fn();g.restore();}

// Hook: in Phrase 0 steht die ganze Überschrift ab Frame 0 und "knallt" rein (mit impact-Sound). Danach Wort für Wort.
function headline(t,k){const hook=k===0;if(hook){const s=1+.22*(1-ease(t/.28));g.save();g.translate(540,300);g.scale(s,s);g.translate(-540,-300);}
  const p=PH[k];let ws=WORDS.slice(p.a,p.b+1);
  // LinkedIn-Fassung (NO_PROMPT_CTA): gesprochener PROMPT-Satz wird rausgeschnitten -> auch nicht als Überschrift zeigen
  if(window.NO_PROMPT_CTA){const i0=WORDS.findIndex(w=>/^(kommentier|comment)/i.test(w.text)),i1=WORDS.findIndex((w,i)=>i>i0&&/^(folg|follow)/i.test(w.text));if(i0>=0&&i1>i0)ws=ws.filter(w=>{const i=WORDS.indexOf(w);return i<i0||i>=i1;});}
  font(800,30);g.fillStyle=L(C.violetL,'#6b55d9');g.textAlign='left';g.fillText(((window.NO_PROMPT_CTA&&k===PH.length-1)?'// MORE PROMPTS':p.label).toUpperCase(),70,170);
  counter(t);
  const maxW=940;let x=70,y=262,ai=0;
  // Akzentwörter: kursive Serifenschrift, farbig (dunkel: Gelb/Lavendel, hell: Rot/Violett)
  // Lange Phrasen (mehr als 2 Zeilen) automatisch kleiner, damit nichts in die Grafik darunter ragt
  let sc=1;const lines=f=>{let n=1,xx=0;ws.forEach(w=>{const a=p.acc.includes(clean(w.text));g.font=a?`italic 400 ${84*f}px 'Instrument Serif'`:`800 ${68*f}px Manrope`;const tw=g.measureText(w.text+' ').width;if(xx+tw>maxW+g.measureText(' ').width){n++;xx=0;}xx+=tw;});return n;};
  while(sc>.7&&lines(sc)>2)sc-=.05;const lh=86*sc;
  const setF=acc=>g.font=acc?`italic 400 ${84*sc}px 'Instrument Serif'`:`800 ${68*sc}px Manrope`;
  ws.forEach(w=>{const txt=w.text;const isAcc=p.acc.includes(clean(txt));setF(isAcc);const tw=g.measureText(txt).width;setF(false);const sp=g.measureText(' ').width;
    if(x+tw>70+maxW){x=70;y+=lh;}
    const a=hook?ease(t/.12):ease((t-w.start+.06)/.14);
    if(a>0){withAlpha(a,()=>{g.save();g.translate(0,(1-a)*14);setF(isAcc);
      g.fillStyle=isAcc?(ai%2?L(C.violetL,C.violet):L(C.amber,C.red)):TXT();
      g.fillText(txt,x,y+(isAcc?4:0));g.restore();});}
    if(isAcc)ai++;x+=tw+sp;});if(hook)g.restore();}
// Zähler oben rechts: Fortschritt der Schritte (aus PROGRESS)
function stepsDone(t){return PROGRESS.items.filter(it=>t>=it.t()).length;}
function counter(t){font(800,28);g.textAlign='right';g.fillStyle=L('rgba(255,255,255,.55)','rgba(20,16,25,.5)');g.fillText(`${PROGRESS.counter} ${stepsDone(t)}/${PROGRESS.items.length}`,1010,170);g.textAlign='left';}
// Fortschritts-Karte unten links: füllt sich, sobald ein Schritt erreicht ist
function progressCard(t){const x=40,y=1300,w=470,h=176,n=PROGRESS.items.length;
  g.save();g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=26;g.shadowOffsetY=10;rr(x,y,w,h,22);g.fillStyle='#f7f3fb';g.fill();g.restore();
  font(800,22);g.fillStyle='#8a7fa6';g.textAlign='left';g.fillText('// '+PROGRESS.kicker,x+24,y+38);
  font(800,30);g.fillStyle=C.ink;g.fillText(PROGRESS.title,x+24,y+74);
  const live=stepsDone(t)>0;g.fillStyle=live?C.green:'#c9bfd8';g.beginPath();g.arc(x+w-92,y+34,7,0,7);g.fill();font(800,20);g.fillStyle='#5b4bb8';g.fillText(live?'live':'ready',x+w-78,y+41);
  const sw=(w-48-(n-1)*14)/n;PROGRESS.items.forEach((it,i)=>{const sx=x+24+i*(sw+14),sy=y+92,on=t>=it.t();const s=on?back(t,it.t(),.35):1;
    scaleAt(sx+sw/2,sy+24,s,()=>{rr(sx,sy,sw,50,14);if(on){g.fillStyle=[C.amber,C.violet,C.green,C.red][i%4];g.fill();}else{g.setLineDash([6,6]);g.lineWidth=3;g.strokeStyle='#c9bfd8';g.stroke();g.setLineDash([]);}
      font(800,19);g.textAlign='center';g.fillStyle=on?C.ink:'#a79fbd';g.fillText((on?'✓ ':'')+it.label,sx+sw/2,sy+32);});});g.textAlign='left';}
function badge(n,x,y,col,t0,t){if(t<t0)return;const s=back(t,t0,.35);scaleAt(x,y,s,()=>{g.fillStyle=col;g.beginPath();g.arc(x,y,54,0,7);g.fill();font(400,70,'Anton');g.fillStyle=C.ink;g.textAlign='center';g.fillText(String(n),x,y+25);});}
function bigLabel(txt,x,y,t0,t,col=null,size=96){if(t<t0)return;const a=ease((t-t0)/.2);withAlpha(a,()=>{font(400,size,'Anton');g.textAlign='left';g.fillStyle=col||TXT();g.fillText(txt,x+(1-a)*-30,y);});}
function stamp(txt,x,y,rot,t0,t,col=C.red,size=56){if(t<t0)return;const s=back(t,t0,.3);scaleAt(x,y,1.6-.6*s,()=>{g.save();g.translate(x,y);g.rotate(rot);font(800,size);const w=g.measureText(txt).width+56;rr(-w/2,-size*.9,w,size*1.8,22);g.lineWidth=10;g.strokeStyle=col;g.stroke();g.fillStyle=col;g.textAlign='center';g.textBaseline='middle';g.fillText(txt,0,4);g.restore();g.textBaseline='alphabetic';});}
function paper(x,y,w,h,rot,lines,title){g.save();g.translate(x+w/2,y+h/2);g.rotate(rot);g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=30;g.shadowOffsetY=12;card(-w/2,-h/2,w,h,C.warm);g.shadowColor='transparent';
  if(title){font(800,26);g.fillStyle='#5b4bb8';g.textAlign='left';g.fillText(title,-w/2+28,-h/2+44);}
  for(let i=0;i<lines;i++){rr(-w/2+28,-h/2+(title?70:40)+i*34,(i%3==2?w*.45:w-56),12,6);g.fillStyle='#cfc5de';g.fill();}g.restore();}
function pill(txt,x,y,col='#3a3155',tc=C.grey){font(800,34);const w=g.measureText(txt).width+48;rr(x,y,w,64,32);g.fillStyle=col;g.fill();g.fillStyle=tc;g.textAlign='left';g.fillText(txt,x+24,y+44);return w;}
function miniChat(x,y,w,h,title){g.save();g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=30;g.shadowOffsetY=12;rr(x,y,w,h,26);g.fillStyle=C.chat||'#f7f3fb';g.fill();g.restore();
  g.save();rr(x,y,w,h,26);g.clip();g.fillStyle='#ece5f7';g.fillRect(x,y,w,64);g.restore();
  [[C.red,0],[C.amber,1],[C.green,2]].forEach(([c,i])=>{g.fillStyle=c;g.beginPath();g.arc(x+34+i*30,y+32,9,0,7);g.fill();});font(800,26);g.fillStyle='#5b4bb8';g.textAlign='left';g.fillText(title,x+140,y+41);}

// prop scenes per phrase (zone y≈430–1180)
function block(x,y,w,h,col,txt,tc,size=44,lines=0){g.save();g.shadowColor='rgba(0,0,0,.25)';g.shadowBlur=20;g.shadowOffsetY=8;rr(x,y,w,h,22);g.fillStyle=col;g.fill();g.restore();
  font(800,size);g.fillStyle=tc;g.textAlign='left';g.fillText(txt,x+30,y+size+22);
  for(let i=0;i<lines;i++){rr(x+30,y+size+50+i*30,(i%3==2?w*.4:w-60),11,5);g.fillStyle='rgba(120,100,150,.35)';g.fill();}}
// ---------- E002: Meeting notes -> to-do list (Claude Codes Part 2) ----------
// PH indices are set from words.json in setup (anchor words), see PH_ANCHORS
const PH=[
 {a:0,b:0,light:true,label:'// CLAUDE CODES PART 2',acc:['meeting','to-do']},
 {a:0,b:0,light:true,label:'// THE PROBLEM',acc:['half']},
 {a:0,b:0,light:true,label:'// THE PROBLEM',acc:['nobody']},
 {a:0,b:0,label:'// STEP 1 · PASTE',acc:['paste']},
 {a:0,b:0,label:'// STEP 2 · THE LIST',acc:['who','what','when']},
 {a:0,b:0,label:'// STEP 3 · NO GUESSING',acc:['guess','asks']},
 {a:0,b:0,label:'// BONUS · EMAIL',acc:['follow-up','email']},
 {a:0,b:0,light:true,label:'// YOUR GUIDE',acc:['prompt','guide']}];
// first word of each phrase (n-th occurrence)
const PH_ANCHORS=[['this',1],['your',1],['a',2],['step',1],['step',2],['no',1],['bonus',1],['comment',1]];
const clean=s=>s.replace(/[.,?:!]/g,'').toLowerCase();
function KW(word,n=1){let c=0;for(const w of WORDS){if(clean(w.text)===word.toLowerCase()){c++;if(c===n)return w.start;}}return 999;}
function KWE(word,n=1){let c=0;for(const w of WORDS){if(clean(w.text)===word.toLowerCase()){c++;if(c===n)return w.end;}}return 999;}
function KWI(word,n=1){let c=0;for(let i=0;i<WORDS.length;i++){if(clean(WORDS[i].text)===word.toLowerCase()){c++;if(c===n)return i;}}return -1;}
function phraseAt(t){let k=0;for(let i=0;i<PH.length;i++){if(t>=WORDS[PH[i].a].start-.12)k=i;}return k;}
function docCard(x,y,w,h,lines,glowc){if(glowc){g.save();g.shadowColor=glowc;g.shadowBlur=40;card(x,y,w,h,C.warm);g.restore();}else card(x,y,w,h,C.warm);
  for(let i=0;i<lines;i++){rr(x+30,y+40+i*36,(i%3==2?w*0.45:w-70),13,6);g.fillStyle='#c9bfd8';g.fill();}}
// messy notes sheet
const NOTES=['call client??','slides – Tom?','budget …','launch date fri?','send offer'];
function notesSheet(x,y,w,h,rot,n=5){g.save();g.translate(x+w/2,y+h/2);g.rotate(rot);g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=30;g.shadowOffsetY=12;card(-w/2,-h/2,w,h,'#fffdf8');g.shadowColor='transparent';
  font(400,50,'Anton');g.fillStyle=C.ink;g.textAlign='left';g.fillText('MEETING NOTES',-w/2+36,-h/2+80);
  for(let i=0;i<n;i++){font(400,44,'Instrument Serif');g.fillStyle='#5b4bb8';g.save();g.translate(-w/2+40+(i%2)*30,-h/2+150+i*72);g.rotate((i%2?.03:-.025));g.fillText(NOTES[i],0,0);g.restore();}
  g.restore();}
function checklist(x,y,w,h,t,t0){g.save();g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=30;g.shadowOffsetY=12;rr(x,y,w,h,28);g.fillStyle='#fff';g.fill();g.restore();
  font(400,46,'Anton');g.fillStyle=C.ink;g.textAlign='left';g.fillText('TO-DO',x+30,y+66);
  [['Lisa','Send offer','Fri'],['Tom','Update slides','Mon'],['Ana','Call client','Wed']].forEach(([a,b,cc],i)=>{const tt=t0+i*.18;if(t<tt)return;const s=back(t,tt,.3);const yy=y+110+i*78;scaleAt(x+w/2,yy+20,s,()=>{
    g.fillStyle=C.green;g.beginPath();g.arc(x+48,yy+18,20,0,7);g.fill();font(800,24);g.fillStyle='#fff';g.textAlign='center';g.fillText('✓',x+48,yy+27);
    font(800,30);g.textAlign='left';g.fillStyle=C.ink;g.fillText(b,x+84,yy+29);font(800,24);g.fillStyle='#8a7fa6';g.fillText(a+' · '+cc,x+84+g.measureText(b).width*1.25+10,yy+28);});});}
function p0(t){notesSheet(90,470,470,560,-.06,5);
  const k=KW('into');const a=ease((t-k)/.3);if(t>k)withAlpha(a,()=>{font(400,120,'Anton');g.fillStyle=C.violet;g.textAlign='center';g.fillText('→',590,820);});
  checklist(520,640,470,380,t,KW('finished'));
  stamp('DONE ✓',700,1110,-.1,KW('list'),t,C.green,50);}
function p1(t){notesSheet(150,480,640,620,-.04,5);
  const k=KW('half');if(t>k){const a=ease((t-k)/.3);withAlpha(a,()=>{g.save();g.lineWidth=8;g.strokeStyle=C.red;g.setLineDash([16,10]);rr(150,600,640,420,24);g.stroke();g.setLineDash([]);g.restore();});}
  bigLabel('HALF SENTENCES',110,1180,KW('sentences'),t,C.red,92);}
function p2(t){notesSheet(150,480,640,620,-.04,5);g.fillStyle='rgba(244,239,231,.6)';g.fillRect(0,440,W,800);
  const items=[['WHO?',C.red,KW('who')],['WHAT?',C.amber,KW('what')],['WHEN?',C.violet,KW('nobody')+.15]];
  items.forEach(([txt,col,t0],i)=>{if(t<t0)return;const s=back(t,t0,.35);const y=560+i*180;scaleAt(450,y+60,s,()=>{g.save();g.shadowColor='rgba(0,0,0,.3)';g.shadowBlur=24;g.shadowOffsetY=10;rr(120+i*60,y,600,130,30);g.fillStyle='#fff';g.fill();g.restore();
    g.fillStyle=col;g.beginPath();g.arc(195+i*60,y+65,40,0,7);g.fill();font(800,48);g.fillStyle='#fff';g.textAlign='center';g.fillText('?',195+i*60,y+82);
    font(400,72,'Anton');g.fillStyle=C.ink;g.textAlign='left';g.fillText(txt,265+i*60,y+92);});});
  bigLabel('A WEEK LATER',110,1180,KW('week'),t,'#6f6688',80);}
function p3(t){badge(1,120,520,C.amber,KW('step'),t);bigLabel('PASTE',200,548,KW('step')+.05,t,'#fff',84);
  const k=KW('paste');if(t>k){const s=back(t,k,.35);scaleAt(460,880,s,()=>{miniChat(90,640,760,520,'Claude · New chat');
    const n=Math.min(5,Math.floor((t-k)/.12)+1);for(let i=0;i<n;i++){font(400,40,'Instrument Serif');g.fillStyle='#5b4bb8';g.textAlign='left';g.fillText(NOTES[i],140,760+i*62);}
    if(t>KW('claude')){rr(620,1080,190,56,28);g.fillStyle=C.violet;g.fill();font(800,26);g.fillStyle='#fff';g.textAlign='center';g.fillText('SEND ↑',715,1117);}});}}
const ROWS=[['Lisa','Send offer','Fri'],['Tom','Update slides','Mon'],['❓','Call client','❓']];
function table(t,cols,rowsT,hl){const x=70,y=650,w=800,cw=[200,380,220];g.save();g.shadowColor='rgba(0,0,0,.4)';g.shadowBlur=26;g.shadowOffsetY=10;rr(x,y,w,420,28);g.fillStyle=C.warm;g.fill();g.restore();
  const heads=['WHO','WHAT','WHEN'];let cx=x+30;heads.forEach((h,i)=>{if(t>=cols[i]){const a=ease((t-cols[i])/.2);withAlpha(a,()=>{font(400,46,'Anton');g.fillStyle=[C.red,C.violet,'#c98a12'][i];g.textAlign='left';g.fillText(h,cx,y+70);});}cx+=cw[i];});
  rr(x+24,y+92,w-48,4,2);g.fillStyle='#d8cfe6';g.fill();
  ROWS.forEach((r,j)=>{if(t<rowsT[j])return;const a=ease((t-rowsT[j])/.2);withAlpha(a,()=>{const yy=y+160+j*90;if(hl&&j===2){rr(x+14,yy-50,w-28,76,16);g.fillStyle='rgba(239,90,76,.14)';g.fill();}
    let xx=x+30;r.forEach((cell,i)=>{const miss=cell==='❓';font(800,miss?30:36);g.fillStyle=miss?C.red:C.ink;g.textAlign='left';g.fillText(miss?'❓ missing':cell,xx,yy);xx+=cw[i];});});});}
function p4(t){badge(2,120,520,C.violetL,KW('step',2),t);bigLabel('THE LIST',200,548,KW('step',2)+.05,t,'#fff',84);
  const k=KW('pulls');table(t,[KW('who',2),KW('what',2),KW('when')],[k,k+.2,KW('when')+.1],false);}
function p5(t){badge(3,120,520,C.green,KW('no'),t);bigLabel('IT ASKS',200,548,KW('no')+.05,t,'#fff',84);
  table(t,[0,0,0],[0,0,0],t>KW('deadline'));
  if(t>KW('guess'))stamp('NO GUESSING',770,540,-.08,KW('guess'),t,C.red,44);
  const k=KW('asks');if(t>k){const s=back(t,k,.35);scaleAt(470,1120,s,()=>{g.save();g.shadowColor='rgba(0,0,0,.4)';g.shadowBlur=24;rr(110,1070,720,100,40);g.fillStyle=C.violet;g.fill();g.restore();
    font(800,32);g.fillStyle='#fff';g.textAlign='left';g.fillText('Who calls the client – and by when?',150,1132);});}}
const MTXT="Thanks, everyone! Here's who does what:";
function p6(t){bigLabel('+ EMAIL',100,548,KW('bonus'),t,C.amber,84);
  if(t>KW('bonus')){const s=back(t,KW('bonus'),.35);scaleAt(460,880,s,()=>{miniChat(90,620,760,560,'New email · To: Team');
    font(800,24);g.fillStyle='#8a7fa6';g.textAlign='left';g.fillText('Subject: Launch meeting – next steps',130,730);
    const typed=typedAt(MTXT,t,KW('writes'),KW('team'));font(800,38);g.fillStyle=C.ink;wrap(typed,130,800,680,50);
    ROWS.forEach((r,i)=>{const t0=KW('team')+i*.15;if(t<t0)return;withAlpha(ease((t-t0)/.2),()=>{const y=940+i*66;font(800,30);g.fillStyle=C.violet;g.fillText('•',130,y);g.fillStyle=C.ink;g.fillText(r[0]==='❓'?'Ana: Call client – Wed':`${r[0]}: ${r[1]} – ${r[2]}`,165,y);});});});}}
function p7(t){const k=KW('comment');const s=back(t,window.NO_PROMPT_CTA?KW('follow'):k,.4);scaleAt(470,700,s,()=>{g.save();g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=30;g.shadowOffsetY=12;rr(80,520,780,330,34);g.fillStyle=C.violet;g.fill();g.restore();
  font(400,92,'Anton');g.fillStyle='#fff';g.textAlign='center';if(window.NO_PROMPT_CTA){g.fillText(UI.follow1,470,660);g.fillStyle=C.amber;g.fillText(UI.follow2,470,770);}else{g.fillText('MEETING → TO-DO',470,660);g.fillStyle=C.amber;g.fillText('FULL GUIDE',470,770);}});
  {const ki=KWI('prompt');if(ki>=0&&!window.NO_PROMPT_CTA){const a=back(t,WORDS[ki].start-.1,.4);if(a>0)scaleAt(470,955,a,()=>{rr(90,890,760,130,65);g.fillStyle='#fff';g.fill();
    font(800,44);g.textAlign='left';g.fillStyle=C.ink;g.fillText(UI.comment,140,970);const w1=g.measureText(UI.comment+' ').width;font(400,62,'Anton');g.fillStyle=C.red;g.fillText('PROMPT',140+w1,974);
    const w2=g.measureText('PROMPT ').width;font(800,32);g.fillStyle='#8a7fa6';g.fillText(UI.dm,140+w1+w2,968);});}}
  if(t>KW('follow')){withAlpha(ease((t-KW('follow'))/.3),()=>{font(800,56);g.fillStyle=L(C.violetL,C.violet);g.textAlign='center';g.fillText(UI.handle,470,1110);});}}
const PROPS=[p0,p1,p2,p3,p4,p5,p6,p7];
const AVP=['loop:explain','loop:think','loop:think','loop:talk','loop:talk','loop:explain','loop:talk','loop:happy'];
const PROGRESS={kicker:'your prompt',title:'Meeting → To-do',counter:'STEP',items:[
  {label:'PASTE',t:()=>KW('step')},{label:'LIST',t:()=>KW('step',2)},{label:'ASK',t:()=>KW('no')},{label:'EMAIL',t:()=>KW('bonus')}]};
window.EXTRA_CUES=()=>[
  {t:KW('finished'),name:'pop',vol:.6},{t:KW('finished')+.18,name:'pop',vol:.6},{t:KW('finished')+.36,name:'pop',vol:.6},{t:KW('list'),name:'stamp',vol:.8},
  {t:KW('half'),name:'click',vol:.6},{t:KW('sentences'),name:'stamp',vol:.5},
  {t:KW('nobody')+.15,name:'pop',vol:.6},{t:KW('who'),name:'pop',vol:.6},{t:KW('what'),name:'pop',vol:.6},
  {t:KW('step'),name:'pop',vol:.7},{t:KW('paste'),name:'typing',vol:.5},{t:KW('claude'),name:'click',vol:.6},
  {t:KW('step',2),name:'pop',vol:.7},{t:KW('who',2),name:'pop',vol:.5},{t:KW('what',2),name:'pop',vol:.5},{t:KW('when'),name:'ding',vol:.5},
  {t:KW('no'),name:'pop',vol:.7},{t:KW('guess'),name:'stamp',vol:.7},{t:KW('asks'),name:'ding',vol:.5},
  {t:KW('writes'),name:'typing',vol:.5},{t:KW('team'),name:'ding',vol:.5},
  {t:KW('comment'),name:'pop',vol:.7}];

function typedAt(s,t,a,b){return s.slice(0,Math.round(s.length*Math.min(Math.max((t-a)/Math.max(.1,b-a),0),1)));}
// ---- Avatar: Posen aus assets/avatar (render.cjs liefert sie als window.AVDATA, data-URIs) ----
const IM={};window.IMGS_READY=false;Promise.all(Object.keys(window.AVDATA||{}).map(n=>new Promise(r=>{const i=new Image();i.onload=r;i.src=window.AVDATA[n];IM[n]=i;}))).then(()=>window.IMGS_READY=true);
// Standbilder: Mund folgt der Lautstärke, aber dezent (max. 55 % der offenen Version)
function mouthOpen(t){const E=window.ENV||[];const i=Math.round(t*(window.FPS||25));const v=E[i]||0;const x=Math.min(1,Math.max(0,(v-.18)/.5));return .55*x*x*(3-2*x);}
let LOOPIMG=null;window.setLoop=d=>new Promise(r=>{const i=new Image();i.onload=()=>{LOOPIMG=i;r();};i.src=d;});
window.loopNeeded=t=>{if(window.SYNC)return 'sync';const p=AVP[phraseAt(t)];return p.startsWith('loop:')?p.slice(5):null;};
// Für render.cjs "track": welche Loops in welcher Zeit (Standbild-Posen -> neutral)
window.avatarPlan=()=>PH.map((p,k)=>({t:k===0?0:WORDS[p.a].start-.12,loop:AVP[k].startsWith('loop:')?AVP[k].slice(5):'neutral'}));
function drawAv(im,imT,open,alpha){let h=700,w=im.width*h/im.height;if(w>900){w=900;h=im.height*w/im.width;}
  const x=1100-w,y=1925-h;g.save();g.globalAlpha=alpha;g.imageSmoothingQuality='high';g.shadowColor='rgba(0,0,0,.4)';g.shadowBlur=40;g.drawImage(im,x,y,w,h);
  g.shadowColor='transparent';if(imT&&open>0.01){g.globalAlpha=alpha*open;g.drawImage(imT,x,y,w,h);}g.restore();}
function avatar(t,k){const bob=Math.sin(t*1.6)*4;g.save();g.translate(0,bob);
  if(window.SYNC){if(LOOPIMG)drawAv(LOOPIMG,null,0,ease(t/.2));g.restore();return;}
  const get=i=>{const p=AVP[i];return p.startsWith('loop:')?[LOOPIMG,null,0]:[IM[p],IM[p+'_talk'],mouthOpen(t)];};
  const t0=k===0?0:WORDS[PH[k].a].start-.12,a=ease((t-t0)/.3),changed=k>0&&AVP[k]!==AVP[k-1];
  // Posenwechsel als harter Schnitt (mit dem kurzen Abdunkeln beim Phrasenwechsel), kein Überblenden
  const cur=get(k);if(cur[0])drawAv(cur[0],cur[1],cur[2],k===0?ease(t/.2):1);g.restore();}
// ---- Sound-Cues: render.cjs mischt diese Effekte aus assets/sfx unter die Stimme ----
function buildCues(){const q=[];const add=(t,n,v)=>{if(t<900)q.push({t:Math.max(0,t),name:n,vol:v||1});};
  add(0,'impact',.9);
  for(let k=1;k<PH.length;k++)add(WORDS[PH[k].a].start-.2,'whoosh',.55);
  add(WORDS[PH[PH.length-1].a].start+.1,'outro',.6);
  (window.EXTRA_CUES?window.EXTRA_CUES():[]).forEach(c=>add(c.t,c.name,c.vol));
  q.sort((a,b)=>a.t-b.t);const out=[];for(const c of q){if(!out.some(o=>o.name===c.name&&Math.abs(o.t-c.t)<.15))out.push(c);}return out;}
function frame(t){g.clearRect(0,0,W,H);const k=phraseAt(t);LIGHT=!!PH[k].light;bgStudio(t);const p=PH[k];const t0=WORDS[p.a].start-.12;
  const push=1+.025*Math.min(Math.max((t-t0)/2.5,0),1);scaleAt(470,800,push,()=>PROPS[k](t));
  // big bust bottom right, gentle sway
  avatar(t,k);
  progressCard(t);
  headline(t,k);
  const d=t-t0;if(k>0&&d>=0&&d<.12){g.fillStyle=`rgba(23,20,31,${.55*(1-d/.12)})`;g.fillRect(0,0,W,H);}}
// Themenspezifische Effekte (pro Reel anpassen): Pop bei Schritt-Badges, Ding bei Haken, Tippen beim Prompt, Klick bei Stempeln
window.setup=(words)=>{WORDS=words;PH.forEach((p,k)=>{p.a=KWI(...PH_ANCHORS[k]);});PH.forEach((p,k)=>{p.b=k<PH.length-1?PH[k+1].a-1:WORDS.length-1;});K=i=>WORDS[i].start;KE=i=>WORDS[i].end;END=WORDS[WORDS.length-1].end+.7;window.CUES=buildCues();return END;};
window.render=(t)=>{frame(t);return c.toDataURL('image/jpeg',.9);};
</script></body></html>
