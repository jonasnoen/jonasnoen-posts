function wrap(text,x,y,maxW,lh,align='left'){const words=text.split(' ');let line='',lines=[];for(const w of words){const tst=line?line+' '+w:w;if(g.measureText(tst).width>maxW&&line){lines.push(line);line=w}else line=tst}lines.push(line);g.textAlign=align;lines.forEach((l,i)=>g.fillText(l,x,y+i*lh));return lines.length;}

      font(800,19);g.textAlign='center';g.fillStyle=on?C.ink:'#a79fbd';g.fillText((on?'✓ ':'')+it.label,sx+sw/2,sy+32);});});g.textAlign='left';}
function badge(n,x,y,col,t0,t){if(t<t0)return;const s=back(t,t0,.35);scaleAt(x,y,s,()=>{g.fillStyle=col;g.beginPath();g.arc(x,y,54,0,7);g.fill();font(400,70,'Anton');g.fillStyle=C.ink;g.textAlign='center';g.fillText(String(n),x,y+25);});}
function bigLabel(txt,x,y,t0,t,col=null,size=96){if(t<t0)return;const a=ease((t-t0)/.2);withAlpha(a,()=>{font(400,size,'Anton');g.textAlign='left';g.fillStyle=col||TXT();g.fillText(txt,x+(1-a)*-30,y);});}
function stamp(txt,x,y,rot,t0,t,col=C.red,size=56){if(t<t0)return;const s=back(t,t0,.3);scaleAt(x,y,1.6-.6*s,()=>{g.save();g.translate(x,y);g.rotate(rot);font(800,size);const w=g.measureText(txt).width+56;rr(-w/2,-size*.9,w,size*1.8,22);g.fillStyle='rgba(255,255,255,.85)';g.fill();g.lineWidth=10;g.strokeStyle=col;g.stroke();g.fillStyle=col;g.textAlign='center';g.textBaseline='middle';g.fillText(txt,0,4);g.restore();g.textBaseline='alphabetic';});}
function paper(x,y,w,h,rot,lines,title){g.save();g.translate(x+w/2,y+h/2);g.rotate(rot);g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=30;g.shadowOffsetY=12;card(-w/2,-h/2,w,h,C.warm);g.shadowColor='transparent';

  for(let i=0;i<lines;i++){rr(-w/2+28,-h/2+(title?70:40)+i*34,(i%3==2?w*.45:w-56),12,6);g.fillStyle='#cfc5de';g.fill();}g.restore();}
function pill(txt,x,y,col='#3a3155',tc=C.grey){font(800,34);const w=g.measureText(txt).width+48;rr(x,y,w,64,32);g.fillStyle=col;g.fill();g.fillStyle=tc;g.textAlign='left';g.fillText(txt,x+24,y+44);return w;}
function miniChat(x,y,w,h,title){g.save();g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=30;g.shadowOffsetY=12;rr(x,y,w,h,26);g.fillStyle=C.chat||'#f7f3fb';g.fill();g.restore();
  g.save();rr(x,y,w,h,26);g.clip();g.fillStyle='#ece5f7';g.fillRect(x,y,w,64);g.restore();

// prop scenes per phrase (zone y≈430–1180)
function letter(x,y,w,h,rot,subj,body,hl){g.save();g.translate(x+w/2,y+h/2);g.rotate(rot);const X=-w/2,Y=-h/2;
  g.shadowColor='rgba(0,0,0,.4)';g.shadowBlur=34;g.shadowOffsetY=14;rr(X,Y,w,h,24);g.fillStyle=C.warm;g.fill();g.shadowColor='transparent';
  font(800,24);g.fillStyle='#8a7fa6';g.textAlign='left';g.fillText('To: ___ Ltd · Data Protection',X+36,Y+56);g.textAlign='right';g.fillText('Date: ___',X+w-36,Y+56);g.textAlign='left';
  if(hl>0){g.fillStyle=`rgba(255,198,92,${.75*hl})`;rr(X+28,Y+84,(w-56)*hl,64,12);g.fill();}
  font(800,40);g.fillStyle=C.ink;g.fillText(subj,X+40,Y+130);
  font(500,30);g.fillStyle='#3b3550';wrap(body,X+40,Y+196,w-80,44);
  font(800,26);g.fillStyle='#5b4bb8';g.fillText('Kind regards, ___',X+40,Y+h-44);g.restore();}
function p0(t){}
function p1(t){const t0=WORDS[PH[1].a].start-.12;const s=back(t,t0,.35);const hl=ease((t-KW('law'))/.3);
  scaleAt(480,800,s,()=>letter(90,450,790,640,-.03,'Access request · Art. 15 GDPR','Please confirm whether you process personal data about me, and send me a free copy of that data, including the purposes, recipients and how long you keep it …',hl));
  stamp('DEADLINE: 1 MONTH',580,1040,-.12,KW('deadline'),t,C.red,48);}
function p2(t){const t0=WORDS[PH[2].a].start-.12;
  withAlpha(.5,()=>letter(60,470,700,560,-.1,'Access · Art. 15','Please confirm whether …',0));
  const s=back(t,t0+.1,.35);scaleAt(520,800,s,()=>letter(170,500,720,600,.04,'Erasure · Art. 17 GDPR','Please erase all personal data you hold about me without undue delay and confirm the deletion in writing …',ease((t-KW('seventeen'))/.3)));
  stamp('SAME PROMPT',500,500,-.08,KW('same'),t,C.green,46);}
const REMIND='Reminder: my request of ___ has gone unanswered for over a month (Art. 12(3) GDPR). Please reply by ___.';
function p3(t){const km=KW('month');if(t>km){const s=back(t,km,.35);scaleAt(230,600,s,()=>{g.save();g.shadowColor='rgba(0,0,0,.4)';g.shadowBlur=26;g.shadowOffsetY=10;rr(90,450,290,290,28);g.fillStyle=C.warm;g.fill();g.restore();
    g.save();rr(90,450,290,290,28);g.clip();g.fillStyle=C.red;g.fillRect(90,450,290,70);g.restore();font(800,30);g.fillStyle='#fff';g.textAlign='center';g.fillText('CALENDAR',235,497);
    font(400,120,'Anton');g.fillStyle=C.ink;g.fillText('+1',235,660);font(800,30);g.fillStyle='#8a7fa6';g.fillText('MONTH',235,712);g.textAlign='left';});
    withAlpha(ease((t-km-.2)/.2),()=>{font(400,72,'Anton');g.fillStyle=C.grey;g.fillText('STILL NO',440,560);g.fillStyle=C.amber;g.fillText('REPLY?',440,650);});}
  const a=KW('writes',2);if(t>a-.05){const s=back(t,a-.05,.35);scaleAt(480,960,s,()=>{miniChat(80,790,800,370,'Claude · Reminder');
    const b=KWE('too');const typed=REMIND.slice(0,Math.round(REMIND.length*Math.min(Math.max((t-a)/(b-a),0),1)));font(500,34);g.fillStyle=C.ink;wrap(typed+((t*2|0)%2?'|':''),115,905,730,48);});}}
function p4(t){const k=KW('comment');const s=back(t,k,.4);scaleAt(470,700,s,()=>{g.save();g.shadowColor='rgba(0,0,0,.45)';g.shadowBlur=30;g.shadowOffsetY=12;rr(80,520,780,330,34);g.fillStyle=C.violet;g.fill();g.restore();
  font(400,92,'Anton');g.fillStyle='#fff';g.textAlign='center';if(window.NO_PROMPT_CTA){g.fillText(UI.follow1,470,660);g.fillStyle=C.amber;g.fillText(UI.follow2,470,770);}else{g.fillText('YOUR DATA',470,660);g.fillStyle=C.amber;g.fillText('FULL GUIDE',470,770);}});
  {const ki=WORDS.findIndex(w=>/prompt/i.test(w.text)&&WORDS.indexOf(w)>=PH[PH.length-1].a);if(ki>=0&&!window.NO_PROMPT_CTA){const a=back(t,WORDS[ki].start-.1,.4);if(a>0)scaleAt(470,955,a,()=>{rr(90,890,760,130,65);g.fillStyle='#fff';g.fill();
    font(800,44);g.textAlign='left';g.fillStyle=C.ink;g.fillText(UI.comment,140,970);const w1=g.measureText(UI.comment+' ').width;font(400,62,'Anton');g.fillStyle=C.red;g.fillText('PROMPT',140+w1,974);
    const w2=g.measureText('PROMPT ').width;font(800,32);g.fillStyle='#8a7fa6';g.fillText(UI.dm,140+w1+w2,968);});}}
  if(t>KW('follow')){withAlpha(ease((t-KW('follow'))/.3),()=>{font(800,56);g.fillStyle=L(C.violetL,C.violet);g.textAlign='center';g.fillText(UI.handle,470,1110);});}}
const PROPS=[p0,p1,p2,p3,p4];
const AVP=['loop:talk','loop:explain','loop:talk','loop:think','loop:happy'];
const PROGRESS={kicker:'your data',title:'GDPR request',counter:'STEP',items:[
  {label:'ACCESS',t:()=>KW('request')},{label:'DELETE',t:()=>KW('deleted')},{label:'REMIND',t:()=>KW('reminder')}]};
// ---- Avatar: Posen aus assets/avatar (render.cjs liefert sie als window.AVDATA, data-URIs) ----
const IM={};window.IMGS_READY=false;Promise.all(Object.keys(window.AVDATA||{}).map(n=>new Promise(r=>{const i=new Image();i.onload=r;i.src=window.AVDATA[n];IM[n]=i;}))).then(()=>window.IMGS_READY=true);
// Standbilder: Mund folgt der Lautstärke, aber dezent (max. 55 % der offenen Version)
function mouthOpen(t){const E=window.ENV||[];const i=Math.round(t*(window.FPS||25));const v=E[i]||0;const x=Math.min(1,Math.max(0,(v-.18)/.5));return .55*x*x*(3-2*x);}
let LOOPIMG=null;window.setLoop=d=>new Promise(r=>{const i=new Image();i.onload=()=>{LOOPIMG=i;r();};i.src=d;});
window.loopNeeded=t=>{if(window.SYNC)return 'sync';const p=AVP[phraseAt(t)];return p.startsWith('loop:')?p.slice(5):null;};
// Für render.cjs "track": welche Loops in welcher Zeit (Standbild-Posen -> neutral)
window.avatarPlan=()=>PH.map((p,k)=>({t:k===0?0:WORDS[p.a].start-.12,loop:AVP[k].startsWith('loop:')?AVP[k].slice(5):'neutral'}));
let BIGAV=false; // Hook-Intro: Memoji groß und mittig
function drawAv(im,imT,open,alpha){let h=BIGAV?1250:700,w=im.width*h/im.height;const mw=BIGAV?1800:900;if(w>mw){w=mw;h=im.height*w/im.width;}
  const x=BIGAV?540-w/2:1100-w,y=1925-h;g.save();g.globalAlpha=alpha;g.imageSmoothingQuality='high';g.shadowColor='rgba(0,0,0,.4)';g.shadowBlur=40;g.drawImage(im,x,y,w,h);
  g.shadowColor='transparent';if(imT&&open>0.01){g.globalAlpha=alpha*open;g.drawImage(imT,x,y,w,h);}g.restore();}
function avatar(t,k){const bob=Math.sin(t*1.6)*4;g.save();g.translate(0,bob);
  if(window.SYNC){if(LOOPIMG)drawAv(LOOPIMG,null,0,ease(t/.2));g.restore();return;}
  const get=i=>{const p=AVP[i];return p.startsWith('loop:')?[LOOPIMG,null,0]:[IM[p],IM[p+'_talk'],mouthOpen(t)];};
  const t0=k===0?0:WORDS[PH[k].a].start-.12,a=ease((t-t0)/.3),changed=k>0&&AVP[k]!==AVP[k-1];
  // Posenwechsel als harter Schnitt (mit dem kurzen Abdunkeln beim Phrasenwechsel), kein Überblenden
  const cur=get(k);if(cur[0])drawAv(cur[0],cur[1],cur[2],k===0?ease(t/.2):1);g.restore();}
// ---- Sound-Cues: render.cjs mischt diese Effekte aus assets/sfx unter die Stimme ----
function buildCues(){const q=[];const add=(t,n,v)=>{if(t<900)q.push({t:Math.max(0,t),name:n,vol:v||1});};
  add(0,'impact',.9);
  for(let k=1;k<PH.length;k++)add(WORDS[PH[k].a].start-.2,'whoosh',.55);
  add(WORDS[PH[PH.length-1].a].start+.1,'outro',.6);
  (window.EXTRA_CUES?window.EXTRA_CUES():[]).forEach(c=>add(c.t,c.name,c.vol));
  q.sort((a,b)=>a.t-b.t);const out=[];for(const c of q){if(!out.some(o=>o.name===c.name&&Math.abs(o.t-c.t)<.15))out.push(c);}return out;}
// ================= Hook-Intro (seit 12.11.2026): solange der Hook läuft, Memoji groß in der Mitte, Hook-Satz darüber =================
// Grund: 63–77 % wischten in den ersten 3 s weg. Text liegt im 3:4-Ausschnitt des Profil-Rasters (y 240–1680).
// Ab Phrase 1 harter Schnitt in die Grafiken, Memoji wieder unten rechts. Abschalten: window.NO_HOOK_FACE=true.
function hookOn(){return !window.NO_HOOK_FACE&&PH.length>2;}
function frame(t){g.clearRect(0,0,W,H);const k=phraseAt(t);LIGHT=!!PH[k].light;bgStudio(t);const p=PH[k];const t0=WORDS[p.a].start-.12;
  if(k===0&&hookOn()){BIGAV=true;avatar(t,k);g.save();g.translate(0,130);headline(t,k);g.restore();BIGAV=false;return;}
  const push=1+.025*Math.min(Math.max((t-t0)/2.5,0),1);scaleAt(470,800,push,()=>PROPS[k](t));
  // big bust bottom right, gentle sway
  avatar(t,k);
  progressCard(t);
  headline(t,k);
  const d=t-t0;if(k>0&&d>=0&&d<.12){g.fillStyle=`rgba(23,20,31,${.55*(1-d/.12)})`;g.fillRect(0,0,W,H);}}
// Themenspezifische Effekte (pro Reel anpassen): Pop bei Schritt-Badges, Ding bei Haken, Tippen beim Prompt, Klick bei Stempeln
window.EXTRA_CUES=()=>[
  {t:WORDS[PH[1].a].start-.1,name:'pop',vol:.7},{t:KW('law'),name:'ding',vol:.5},{t:KW('deadline'),name:'click',vol:.8},
  {t:WORDS[PH[2].a].start,name:'pop',vol:.6},{t:KW('same'),name:'click',vol:.8},{t:KW('seventeen'),name:'ding',vol:.5},
  {t:KW('month'),name:'pop',vol:.7},{t:KW('writes',2),name:'typing',vol:.6},{t:KW('writes',2)+.5,name:'typing',vol:.6},{t:KW('reminder'),name:'ding',vol:.5},
  {t:KW('comment'),name:'pop',vol:.7}];
window.setup=(words)=>{WORDS=words;K=i=>WORDS[i].start;KE=i=>WORDS[i].end;END=WORDS[WORDS.length-1].end+.7;window.CUES=buildCues();return END;};
window.render=(t)=>{frame(t);return c.toDataURL('image/jpeg',.9);};
